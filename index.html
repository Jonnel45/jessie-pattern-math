<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f2ff">
<title>Jessie's Pattern Math Lab</title>
<style>
:root{--bg:#fbf8ff;--ink:#23304a;--muted:#68738a;--card:#fff;--accent:#6c63ff;--accent2:#9a8cff;--good:#16875d;--soft:#f0eeff;--line:#e4e1ef;--warn:#ffb23f;--bad:#c95656}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#fffaf4,#f6f2ff);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid #eee}
h1{font-size:24px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}
main{max-width:1050px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tabs button{white-space:nowrap}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 8px 30px rgba(60,50,110,.10)}
.badge{display:inline-block;background:var(--soft);color:#5149cc;padding:6px 10px;border-radius:999px;font-weight:850;font-size:13px}
.progress{height:9px;background:#eee;border-radius:999px;overflow:hidden;margin:9px 0 16px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
h2{font-size:27px;margin:12px 0 10px}.story{font-size:18px;line-height:1.52}.prompt{font-size:21px;font-weight:850;margin:18px 0 10px}.small{font-size:14px;color:var(--muted)}
button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.good{background:#dcf5e8;border-color:#8dd4b3} button:disabled{opacity:.45}
.controls{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.original{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;background:#fffdf9;border:2px solid #eee2cf;border-radius:18px;padding:16px}
.original img{width:100%;border-radius:14px;border:1px solid #ddd;max-height:410px;object-fit:contain;background:white}
@media(max-width:760px){.original{grid-template-columns:1fr}.original img{max-height:330px}}
.qtext{font-size:17px;line-height:1.55}.qtext b{display:block;margin-top:10px}
.route{background:#eef7ff;border-left:5px solid #5a8dcc;border-radius:12px;padding:13px;margin-top:14px;font-size:17px;line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.pattern,.panel{background:#fafafa;border:1px solid var(--line);border-radius:18px;padding:14px}
.item{width:43px;height:43px;border-radius:50%;box-shadow:0 2px 6px #0002;border:2px solid #fff}.red{background:#ed5a61}.blue{background:#5a8dcc}.green{background:#5caf69}.yellow{background:#f2ca3d}.purple{background:#8b66bb}.pink{background:#e98aa4}.black{background:#222831}.white{background:white;border-color:#aaa}.candy{border-radius:13px}
.cycle{display:inline-flex;gap:6px;padding:9px;border:3px dashed #8b82ff;border-radius:16px;background:#f7f5ff}
.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}@media(max-width:640px){.choicegrid{grid-template-columns:1fr}.item{width:37px;height:37px}}
.feedback{min-height:30px;font-size:17px;font-weight:800;margin-top:8px}
.eq{font-size:30px;font-weight:900;text-align:center;padding:13px}
.bigsummary{font-size:20px;line-height:1.55;background:#effbf5;border-left:6px solid var(--good);padding:16px;border-radius:14px}
.visualRule{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;margin:14px 0}
.visualBox{border:2px solid var(--line);border-radius:16px;padding:13px;text-align:center;background:white}.op{font-size:30px;font-weight:900}
@media(max-width:700px){.visualRule{grid-template-columns:1fr}.op{font-size:22px}}
.tileTray,.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.tile{min-width:70px;text-align:center;font-size:25px;padding:12px 15px;border:2px solid #cfc9ef;border-radius:14px;background:white;touch-action:none;user-select:none}
.slot{min-width:78px;height:60px;border:3px dashed #bbb4df;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:850;background:#faf9ff}
.slot.filled{border-style:solid;border-color:#7e73ff;background:#f1efff}
.groupbox{display:inline-flex;gap:5px;padding:8px;border:2px solid #888;border-radius:12px;margin:3px}.counter{font-size:28px;font-weight:900}
.tenGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}@media(min-width:750px){.tenGrid{grid-template-columns:repeat(5,1fr)}}.ten{border:1px solid var(--line);border-radius:15px;padding:10px;background:white}.dot{width:17px;height:17px;border-radius:50%;background:var(--accent);display:inline-block;margin:2px}.five{border:2px solid #999;border-radius:10px;padding:4px;margin:4px 0}
.leftover{padding:10px;border:3px solid var(--warn);border-radius:16px;background:#fff8e9}.test{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
</style>
</head>
<body>
<header><h1>✨ Jessie's Pattern Math Lab</h1><div class="sub">Each question has its own solving path — learn the idea, build the maths, calculate, then explain it.</div></header>
<main><div class="tabs" id="tabs"></div><div class="card">
<span id="badge" class="badge"></span><div class="progress"><div id="bar" class="bar"></div></div>
<div id="stage"></div>
<div class="controls"><button id="back">← Back</button><button id="next" class="primary">Next →</button></div>
</div></main>
<script>
const C={
1:{title:"Emma's gems",img:"images/q1.jpg",text:"There is a box of gems. Emma arranges them in a repeating pattern of 2 red gems, 1 blue gem, and 3 green gems. She places a total of 44 gems.",subs:["(1) The 30th gem is _____.","(2) Among the 44 gems, Emma places _____ green gems in total."],pat:[["red",2],["blue",1],["green",3]],shape:"",pages:["orig","q1cycle","q1pos","q1total","q1green","q1sum"]},
2:{title:"Sophia's bracelet",img:"images/q2.jpg",text:"Sophia makes a bracelet using beads. The pattern repeats as 1 yellow bead, 2 purple beads, and 2 pink beads. She uses a total of 90 beads.",subs:["(1) There are _____ beads in each cycle, and there are _____ complete cycles in total.","(2) In the 90 beads, Sophia uses a total of _____ purple beads and _____ yellow beads."],pat:[["yellow",1],["purple",2],["pink",2]],shape:"",pages:["orig","q2cycle","q2sentence","q2calc","q2purple","q2yellow","q2sum","q2test"]},
3:{title:"Leo's Go stones",img:"images/q3.jpg",text:"There is a pile of Go stones. Leo places them in a repeating pattern of 4 black stones followed by 3 white stones. He places a total of 60 stones.",subs:["(1) The 55th stone is _____.","(2) Among the 60 stones, Leo places _____ black stones in total."],pat:[["black",4],["white",3]],pages:["orig","cycle7","pos55","sixty7","black36","sumPosCount"]},
4:{title:"Go stones",img:"images/q4.jpg",text:"A player arranges Go stones in a row. He follows this pattern: 3 black stones, 2 white stones. In the end, he arranges 41 stones altogether.",subs:["(1) There are _____ stones in each cycle, and there are _____ complete cycles.","(2) In the 41 stones, the player puts _____ black stones and _____ white stones in total."],pat:[["black",3],["white",2]],pages:["orig","cycle5","fortyone5","q4black","q4white","sumCount"]},
5:{title:"Kevin's candies",img:"images/q5.jpg",text:"Kevin arranges candies in a row. He follows this pattern: 1 red candy, 2 yellow candies, and 3 green candies. In the end, he arranges 52 candies altogether.",subs:["(1) There are _____ candies in each cycle, and there are _____ complete cycles.","(2) In the 52 candies, Kevin puts _____ red candies and _____ green candies in total."],pat:[["red",1],["yellow",2],["green",3]],shape:"candy",pages:["orig","cycle6","fiftytwo6","q5red","q5green","sumCount"]},
6:{title:"Tom's Go stones",img:"images/q6.jpg",text:"Tom puts some Go stones in a row. He puts 4 black stones first, and then follows this repeating pattern: 2 white stones and 3 black stones. In the end, Tom puts a total of 51 stones.",subs:["(1) There are _____ stones in each cycle, and there are _____ complete cycles.","(2) How many white stones and black stones does he put altogether?"],pat:[["white",2],["black",3]],first:[["black",4]],pages:["orig","q6first","q6divide","q6white","q6black","sumFirst"]},
7:{title:"Lily's gems",img:"images/q7.jpg",text:"Lily arranges gems in a row. She follows this pattern: 2 blue gems, 3 purple gems, and 1 green gem. In the end, she arranges 47 gems altogether.",subs:["(1) There are _____ gems in each cycle, and there are _____ complete cycles.","(2) In the 47 gems, Lily puts _____ purple gems and _____ green gems in total."],pat:[["blue",2],["purple",3],["green",1]],pages:["orig","cycle6","fortyseven6","q7purple","q7green","sumCount"]},
8:{title:"Emma's gems",img:"images/q8.jpg",text:"Emma arranges some gems in a row. She puts 3 blue gems first, and then follows this repeating pattern: 1 green gem, 2 purple gems, and 2 blue gems. In the end, Emma arranges 55 gems altogether.",subs:["(1) There are _____ gems in each cycle, and there are _____ complete cycles.","(2) How many purple gems does she put altogether?"],pat:[["green",1],["purple",2],["blue",2]],first:[["blue",3]],pages:["orig","q8first","q8divide","q8purple","sumFirst"]},
9:{title:"Sophia's candies",img:"images/q9.jpg",text:"Sophia puts some candies in a row. She puts 5 red candies first, and then follows this repeating pattern: 3 yellow candies, 2 green candies, and 1 red candy. In the end, Sophia puts 62 candies altogether.",subs:["(1) There are _____ candies in each cycle, and there are _____ complete cycles.","(2) How many red candies does she put altogether?"],pat:[["yellow",3],["green",2],["red",1]],first:[["red",5]],shape:"candy",pages:["orig","q9first","q9divide","q9red","sumFirst"]}
};
let qn=1,pi=0;
const stage=document.getElementById("stage"),next=document.getElementById("next"),back=document.getElementById("back");
const bead=(c,shape="")=>`<span class="item ${c} ${shape}"></span>`;
function spec(p,shape=""){return p.map(([c,n])=>Array.from({length:n},()=>bead(c,shape)).join("")).join("")}
function cycle(q=C[qn]){return `<span class="cycle">${spec(q.pat,q.shape||"")}</span>`}
function orig(q){
return `<h2>Original question</h2><div class="original"><div><div class="pattern" style="margin-bottom:10px"><span class="cycle">${spec(q.pat,q.shape||"")}</span></div>${q.first?`<div class="small" style="margin-bottom:8px">Items placed first:</div><div class="pattern" style="margin-bottom:10px">${spec(q.first,q.shape||"")}</div>`:""}</div><div class="qtext"><b>${q.title}</b><div>${q.text}</div><b>${q.subs[0]}</b><b>${q.subs[1]}</b></div></div>
<div class="route"><b>Solving path for this question:</b> ${routeText(qn)}</div>`}
function routeText(n){
return {
1:"First understand a 6-gem cycle → use the cycle to locate the 30th gem → then use 44 ÷ 6 to count complete cycles and work out the green gems.",
2:"Use part (1) to build the whole idea: count one cycle → decide how to find the number of cycles → learn 90 ÷ 5 → then use the cycle count to find purple and yellow totals.",
3:"Count a 7-stone cycle → use division and the remainder to locate the 55th stone → then use 60 ÷ 7 to count black stones.",
4:"Count one 5-stone cycle → find how many full cycles fit into 41 and what is left → use the picture to count black and white totals.",
5:"Count one 6-candy cycle → divide 52 into full cycles and a leftover piece → use both full cycles and leftover candies to find red and green totals.",
6:"Separate the 4 black stones placed first → solve the repeating part only → then put the first stones back when counting black stones.",
7:"Divide 47 into 6-gem cycles and a leftover piece → inspect the leftover colours → calculate purple and green totals.",
8:"Separate the 3 blue gems placed first → divide the remaining gems into 5-gem cycles → use full cycles plus the leftover piece to count purple gems.",
9:"Separate the 5 red candies placed first → divide the remaining candies into 6-candy cycles → add the first red candies back at the end."
}[n]}
function tiles(target, distract){
 const all=[...target,...distract].sort(()=>Math.random()-.5);
 setTimeout(()=>setupTiles(target),0);
 return `<div class="small">Drag the tiles into the boxes. On iPad, you can also tap a tile and then tap a box.</div><div class="tileTray" id="tray">${all.map((v,i)=>`<div class="tile" draggable="true" data-v="${v}" id="tile${i}">${v}</div>`).join("")}</div><div class="slots">${target.map((_,i)=>`<div class="slot" data-i="${i}"></div>`).join("")}</div><div id="feedback" class="feedback"></div>`;
}
function setupTiles(target){
 let selected=null;
 const ts=[...document.querySelectorAll(".tile")], ss=[...document.querySelectorAll(".slot")];
 function place(tile,slot){ if(slot.dataset.v){return} slot.textContent=tile.dataset.v;slot.dataset.v=tile.dataset.v;slot.classList.add("filled");tile.style.visibility="hidden";check();}
 function check(){const vals=ss.map(s=>s.dataset.v||"");if(vals.every(Boolean)){const ok=vals.join("|")===target.join("|");const f=document.getElementById("feedback");f.innerHTML=ok?"✅ Great. This is the mathematical sentence we need. Now calculate it on the next page.":"Not quite. Look at the picture and ask: total? group size? how many groups? Tap a filled box to clear it.";f.style.color=ok?"var(--good)":"var(--bad)";}}
 ts.forEach(t=>{t.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",t.id));t.onclick=()=>{selected=t;ts.forEach(x=>x.style.outline="");t.style.outline="4px solid #9b91ff";}});
 ss.forEach(s=>{s.addEventListener("dragover",e=>e.preventDefault());s.addEventListener("drop",e=>{e.preventDefault();const t=document.getElementById(e.dataTransfer.getData("text/plain"));if(t)place(t,s)});s.onclick=()=>{if(s.dataset.v){const val=s.dataset.v;const t=ts.find(x=>x.dataset.v===val&&x.style.visibility==="hidden");if(t)t.style.visibility="visible";s.textContent="";delete s.dataset.v;s.classList.remove("filled");return}if(selected)place(selected,s);};});
}
function choice(prompt,opts,good){
 return `<div class="prompt">${prompt}</div><div class="choicegrid">${opts.map(o=>`<button onclick="pick(this,'${o.key}','${good}')">${o.label}</button>`).join("")}</div><div id="feedback" class="feedback"></div>`
}
window.pick=(b,v,g)=>{const f=document.getElementById("feedback");if(v===g){b.classList.add("good");f.textContent="✅ Yes — explain why.";f.style.color="var(--good)"}else{f.textContent="Try again. Use the picture, not a guess.";f.style.color="var(--bad)"}}
function groups(total,size,pat,shape=""){
 let full=Math.floor(total/size),rem=total%size;
 let html=`<div class="row">${Array.from({length:Math.min(full,10)},()=>`<span class="groupbox">${spec(pat,shape)}</span>`).join("")}${full>10?" …":""}</div>`;
 if(rem){let flat=[];pat.forEach(([c,n])=>{for(let i=0;i<n;i++)flat.push(c)});html+=`<div class="prompt">Left over:</div><div class="leftover row">${flat.slice(0,rem).map(c=>bead(c,shape)).join("")}</div>`}
 return html;
}
function render(){
 const q=C[qn],page=q.pages[pi];
 document.getElementById("tabs").innerHTML=Object.keys(C).map(n=>`<button class="${+n===qn?'primary':''}" onclick="qn=${n};pi=0;render()">Q${n}</button>`).join("");
 document.getElementById("badge").textContent=`Question ${qn} · Page ${pi+1} of ${q.pages.length}`;
 document.getElementById("bar").style.width=((pi+1)/q.pages.length*100)+"%";
 back.disabled=pi===0;next.textContent=pi===q.pages.length-1?(qn===9?"Start again ↻":"Next question →"):"Next →";
 let h="";
 if(page==="orig") h=orig(q);

 if(page==="q2cycle") h=`<h2>Part (1): How many beads are in ONE cycle?</h2><div class="story">The picture repeats like this:</div><div class="pattern">${cycle()}</div>
 <div class="prompt">Jessie, touch each bead and count.</div><div class="eq">1 + 2 + 2 = ?</div>${choice("How many beads are in one complete cycle?",[{key:"4",label:"4"},{key:"5",label:"5"},{key:"6",label:"6"}],"5")}
 <div class="bigsummary">One complete cycle has <b>5 beads</b>. We will use this fact in the next blank.</div>`;
 if(page==="q2sentence") h=`<h2>Part (1): How many complete cycles are in 90 beads?</h2><div class="visualRule"><div class="visualBox"><b>90 beads</b><br><span class="small">TOTAL</span></div><div class="op">?</div><div class="visualBox"><b>5 beads</b><br><span class="small">IN EACH CYCLE</span></div><div class="op">→</div><div class="visualBox"><b>How many cycles?</b></div></div>
 <div class="story">We are not making more beads. We are splitting 90 beads into equal groups of 5.</div>${tiles(["90","÷","5","=","?"],["×","+","18","6"])}
 <div class="route">Do not calculate yet. First build the correct maths sentence.</div>`;
 if(page==="q2calc") h=`<h2>Learn how to calculate 90 ÷ 5</h2><div class="story">Instead of counting 90 beads one by one, turn 90 into <b>9 tens</b>. Tap every 10.</div>
 <div class="tenGrid" id="tens">${Array.from({length:9},(_,i)=>`<button class="ten" data-i="${i}"><b>10</b><div>${Array.from({length:10},()=>'<span class="dot"></span>').join("")}</div></button>`).join("")}</div>
 <div class="row" style="margin-top:12px"><div><span class="small">Tens opened</span><div class="counter" id="opened">0 / 9</div></div><div><span class="small">Groups of 5 found</span><div class="counter" id="g5">0</div></div></div><div id="feedback" class="feedback"></div>
 <div class="bigsummary" style="margin-top:14px"><b>Fast calculation rule:</b><br>90 ÷ 5 = (90 ÷ 10) × 2<br>= 9 × 2<br>= 18<br><br><b>Why?</b> Every 10 contains two 5s.</div>`;
 if(page==="q2purple") h=`<h2>Part (2): How many purple beads?</h2><div class="story">From part (1), we already know there are <b>18 cycles</b>. Look at ONE cycle.</div><div class="pattern">${cycle()}</div>
 ${choice("How many purple beads are in ONE cycle?",[{key:"1",label:"1"},{key:"2",label:"2"},{key:"3",label:"3"}],"2")}
 <div class="visualRule"><div class="visualBox"><b>18 cycles</b></div><div class="op">×</div><div class="visualBox"><b>2 purple in each</b></div><div class="op">=</div><div class="visualBox"><b>Total purple</b></div></div>
 ${tiles(["18","×","2","=","36"],["+","÷","20","34"])}
 <div class="bigsummary">When we know <b>how many groups</b> and <b>how many in each group</b>, multiplication gives the <b>total</b>.</div>`;
 if(page==="q2yellow") h=`<h2>Part (2): How many yellow beads?</h2><div class="story">Again, there are <b>18 cycles</b>. Look at one cycle.</div><div class="pattern">${cycle()}</div>
 ${choice("How many yellow beads are in ONE cycle?",[{key:"1",label:"1"},{key:"2",label:"2"},{key:"5",label:"5"}],"1")}
 ${tiles(["18","×","1","=","18"],["÷","+","36","20"])}
 <div class="bigsummary">One yellow in every cycle means the number of yellow beads is the same as the number of cycles.</div>`;
 if(page==="q2sum") h=`<h2>Summary: the two big ideas in this question</h2>
 <div class="visualRule"><div class="visualBox"><b>90 total beads</b></div><div class="op">÷</div><div class="visualBox"><b>5 in each cycle</b></div><div class="op">=</div><div class="visualBox"><b>18 cycles</b></div></div>
 <div class="bigsummary"><b>DIVISION:</b> I know the total and the size of each group. I want to know <b>how many groups</b>.</div>
 <div class="visualRule"><div class="visualBox"><b>18 cycles</b></div><div class="op">×</div><div class="visualBox"><b>2 purple in each</b></div><div class="op">=</div><div class="visualBox"><b>36 purple total</b></div></div>
 <div class="bigsummary"><b>MULTIPLICATION:</b> I know how many groups and how many are in each group. I want the <b>total</b>.</div>`;
 if(page==="q2test") h=`<h2>Test the thinking — no worked answer</h2><div class="test"><b>A new bracelet has 35 beads.</b> One cycle has 5 beads. What maths sentence would tell us the number of cycles?</div>${tiles(["35","÷","5","=","?"],["×","+","7","30"])}
 <div class="test"><b>Then imagine each cycle has 3 purple beads.</b> What operation would find the total number of purple beads?</div>${choice("Choose the idea.",[{key:"m",label:"number of cycles × 3"},{key:"d",label:"number of cycles ÷ 3"}],"m")}`;

 // Generic tailored pages for the other questions.
 if(page==="q1cycle") h=`<h2>Part (1): First understand ONE 6-gem cycle</h2><div class="pattern">${cycle()}</div>${choice("Count the gems. How many are in one cycle?",[{key:"5",label:"5"},{key:"6",label:"6"},{key:"7",label:"7"}],"6")}<div class="route">We need this before we can locate the 30th gem.</div>`;
 if(page==="q1pos") h=`<h2>Where does the 30th gem land?</h2><div class="story">Every cycle has 6 gems. Build the sentence that asks how many groups of 6 fit into 30.</div>${tiles(["30","÷","6","=","?"],["×","+","5","24"])}${groups(30,6,q.pat)}<div class="bigsummary">30 makes exactly 5 full cycles, so the 30th gem is the <b>last gem in a cycle</b>. Look at one cycle and identify that colour yourself.</div>`;
 if(page==="q1total") h=`<h2>Part (2): Now use all 44 gems</h2><div class="story">We need complete cycles plus any leftover gems.</div>${tiles(["44","÷","6","=","?"],["×","+","7","2"])}${groups(44,6,q.pat)}<div class="bigsummary">The picture shows <b>7 full cycles and 2 leftover gems</b>. Those 2 leftovers are the first two red gems of the next cycle.</div>`;
 if(page==="q1green") h=`<h2>How many green gems are there?</h2><div class="pattern">${cycle()}</div><div class="story">Each full cycle has 3 green gems. There are 7 full cycles. The 2 leftover gems are red, so they add no green.</div>${tiles(["7","×","3","=","21"],["÷","+","18","23"])}<div class="bigsummary">Always inspect the leftover piece before deciding whether it changes the colour total.</div>`;
 if(page==="q1sum") h=sumPage("Position question: divide by the cycle size and use the remainder to locate the position. Colour-total question: count full cycles × colour-per-cycle, then inspect leftovers.");

 if(page==="cycle7") h=`<h2>Build ONE cycle first</h2><div class="pattern">${cycle()}</div>${choice("How many stones are in one cycle?",[{key:"6",label:"6"},{key:"7",label:"7"},{key:"8",label:"8"}],"7")}`;
 if(page==="pos55") h=`<h2>Part (1): Locate the 55th stone</h2>${tiles(["55","÷","7","=","?"],["×","+","8","6"])}<div class="story">55 ÷ 7 gives 7 full cycles with remainder 6. The remainder tells us to look at the <b>6th stone in ONE cycle</b>.</div><div class="pattern">${cycle()}</div>${choice("What colour is the 6th stone?",[{key:"black",label:"black"},{key:"white",label:"white"}],"white")}`;
 if(page==="sixty7") h=`<h2>Part (2): Split 60 stones into 7-stone cycles</h2>${tiles(["60","÷","7","=","?"],["×","+","8","4"])}${groups(60,7,q.pat)}<div class="bigsummary">There are 8 full cycles and 4 stones left. The leftover stones are the first 4 black stones of the next cycle.</div>`;
 if(page==="black36") h=`<h2>Count all black stones</h2><div class="story">8 full cycles × 4 black in each = 32 black. The 4 leftover stones are also black.</div>${tiles(["32","+","4","=","36"],["×","÷","28","40"])}<div class="bigsummary">Full-cycle black + leftover black = total black.</div>`;
 if(page==="sumPosCount") h=sumPage("For the 55th position, division gives a remainder that points to a place inside the cycle. For the total black count, division gives full cycles plus a leftover piece that must be inspected.");
